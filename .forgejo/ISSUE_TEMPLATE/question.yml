name: ❓ Questions and everything else
description: We'd love to hear from you!
type: "task"
body:
  - type: checkboxes
    id: terms
    attributes:
      label: Terms
      options:
        - label: I have searched [open and closed issues](https://codeberg.org/andrewtavis/slides/issues?q=is%3Aissue)
          required: true
        - label: I agree to follow Slide's [Code of Conduct](https://codeberg.org/andrewtavis/slides/src/commit/e34ac36bffb1bfb824328db13caab074a544e4f9/.forgejo/CODE_OF_CONDUCT.md)
          required: true
  - type: textarea
    id: issue
    attributes:
      label: Issue
      placeholder: Ask a question, start a discussion, create an issue...
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Thank you for your contribution!
