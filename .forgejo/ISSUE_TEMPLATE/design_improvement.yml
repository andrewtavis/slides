name: 🎨 Design improvement
description: Make a suggestion for Slide's UX/UI designs.
labels: ["design"]
type: "feature"
body:
  - type: checkboxes
    id: terms
    attributes:
      label: Terms
      options:
        - label: I have searched [open and closed design issues](https://codeberg.org/andrewtavis/slides/issues?q=is%3Aissue+label%3Adesign)
          required: true
        - label: I agree to follow Slide's [Code of Conduct](https://codeberg.org/andrewtavis/slides/src/commit/e34ac36bffb1bfb824328db13caab074a544e4f9/.forgejo/CODE_OF_CONDUCT.md)
          required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: A brief description of the enhancement you propose (with screenshots if applicable).
    validations:
      required: true
  - type: textarea
    id: contribution
    attributes:
      label: Contribution
      placeholder: Let us know if you'd like to help and how :)
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        Thank you for your suggestion!
